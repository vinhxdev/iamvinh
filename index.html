<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#09090b" />

  <meta property="og:title" content="VinhProfile" />
  <meta property="og:description" content="Software Developer profile by Vinhx." />
  <meta property="og:type" content="website" />

    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 30'%3E%3Crect width='110' height='30' rx='4' fill='%23000'/%3E%3Ctext x='5' y='21' font-family='Arial' font-size='16' font-weight='bold' fill='%23fff'%3EVinh%3C/text%3E%3Crect x='45' y='4' width='60' height='22' rx='3' fill='%23f90'/%3E%3Ctext x='48' y='20' font-family='Arial' font-size='16' font-weight='bold' fill='%23000'%3EProfile%3C/text%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="jumpscare-container" aria-hidden="true">
    <img src="https://orion-uploads.openroadmedia.com/md_ebb42c5c23d5-jump-scare-feat.jpg" alt="" draggable="false" />
  </div>

  <div class="settings-container">
    <button class="settings-btn" type="button" onclick="toggleSettings()" aria-label="Open settings">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </button>

    <div class="settings-menu" id="settingsMenu">
      <div class="menu-section">
        <h4>EFFECTS</h4>
        <div class="menu-grid" id="effect-group">
          <button class="ctrl-btn" type="button" onclick="toggleEffect('stars', this)">Stars</button>
          <button class="ctrl-btn" type="button" onclick="toggleEffect('matrix', this)">Matrix</button>
          <button class="ctrl-btn" type="button" onclick="toggleEffect('neon', this)">Neon</button>
          <button class="ctrl-btn" type="button" onclick="toggleEffect('sakura', this)">Sakura</button>
          <button class="ctrl-btn" type="button" onclick="toggleEffect('snow', this)">Snow</button>
          <button class="ctrl-btn" type="button" onclick="toggleEffect('none', this)">Off</button>
        </div>
      </div>

      <div class="menu-section">
        <h4>CURSORS</h4>
        <div class="menu-grid" id="cursor-group">
          <button class="ctrl-btn active" type="button" onclick="changeCursor('default', this)">Normal</button>
          <button class="ctrl-btn" type="button" onclick="changeCursor('ring', this)">Ring</button>
          <button class="ctrl-btn" type="button" onclick="changeCursor('cyber', this)">Cyber</button>
          <button class="ctrl-btn" type="button" onclick="changeCursor('fire', this)">Fire</button>
          <button class="ctrl-btn" type="button" onclick="changeCursor('trail', this)">Trail</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="donateModal" role="dialog" aria-modal="true" aria-labelledby="donateTitle">
    <div class="modal-content" id="modalContent">
      <button class="close-modal" type="button" onclick="closeDonate()" aria-label="Close donate modal">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>

      <h3 id="donateTitle">Fund my coffee</h3>
      <p class="modal-desc">Enter VNĐ amount and transfer content</p>

      <input
        type="number"
        id="donateAmount"
        placeholder="9999"
        inputmode="numeric"
        min="0"
        max="999999999"
        oninput="updateQR()"
        autocomplete="off"
      />

      <input
        type="text"
        id="donateInfo"
        placeholder="Donate Vinhx"
        maxlength="80"
        value="Donate Vinhx"
        oninput="updateQR()"
        autocomplete="off"
      />

      <div class="donate-meta">
        <div>
          <span>Bank</span>
          <strong>ACB</strong>
        </div>
        <div>
          <span>Account</span>
          <strong>33689707</strong>
        </div>
        <div>
          <span>Name</span>
          <strong>NGUYEN NGOC TRI VINH</strong>
        </div>
        <div>
          <span>Content</span>
          <strong id="transferContent">Donate Vinhx</strong>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" onclick="copyTransferContent()">
          <i class="fa-regular fa-copy"></i>
          Copy content
        </button>

        <button type="button" onclick="downloadQR()">
          <i class="fa-solid fa-download"></i>
          Download QR
        </button>
      </div>

      <div class="qr-box">
        <img id="qrImage" src="/api/qr?amount=0&info=Donate%20Vinhx" alt="Donate QR Code" draggable="false" />
      </div>
    </div>
  </div>

  <main class="cv-card">
    <header class="header">
      <img
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3lwaHF6MTI1NmpyajNpcHNsY3hzZHFsMWhzZWhpc3ljNGRha21ubiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/s2pr9CVOvU4NMBsnYf/giphy.gif"
        class="avatar"
        alt="Vinhx avatar"
        draggable="false"
      />

      <h1 class="name">Vinhx</h1>
      <p class="title">Software Developer</p>

      <div class="view-counter" title="Realtime views">
        <div class="eye-container" id="eye-parent" aria-hidden="true">
          <div class="moving-eye">
            <div class="pupil"></div>
          </div>
        </div>
        <span id="visit-count">...</span>
        <span>views</span>
      </div>
    </header>

    <section class="section">
      <h2>About Me</h2>
      <p id="about-text" class="typing-cursor"></p>
    </section>

    <section class="section">
      <h2>Skills</h2>
      <div class="skills-container">
        <span class="skill-tag">HTML/CSS</span>
        <span class="skill-tag">Python</span>
        <span class="skill-tag">Java</span>
        <span class="skill-tag">Lua</span>
        <button class="skill-tag" type="button" onclick="window.open('https://nohello.net/vi/', '_blank', 'noopener,noreferrer')">Hello()</button>
        <button class="skill-tag" type="button" onclick="triggerJumpscare()">Yapping()</button>
      </div>
    </section>

    <button class="donate-btn" type="button" onclick="openDonate()">
      <i class="fa-solid fa-mug-hot" aria-hidden="true"></i>
      <span>Buy me a coffee</span>
    </button>

    <nav class="social-links" aria-label="Social links">
      <a href="https://vinhx.site/" target="_blank" rel="noopener noreferrer" aria-label="Website">
        <i class="fas fa-globe" aria-hidden="true"></i>
      </a>
      <a href="https://github.com/vinhxdev" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com/nguyenvinhtriowo/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fab fa-facebook-f" aria-hidden="true"></i>
      </a>
      <a href="https://steamcommunity.com/id/P1mple1st/" target="_blank" rel="noopener noreferrer" aria-label="Steam">
        <i class="fab fa-steam" aria-hidden="true"></i>
      </a>
      <a href="mailto:nguyenngoctrivinh72@gmail.com" aria-label="Email">
        <i class="fas fa-envelope" aria-hidden="true"></i>
      </a>
    </nav>
  </main>

  <div class="footer-tag">@trustmebro</div>

  <script src="./script.js" defer></script>
</body>
</html>
