<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinhx - Portfolio</title>
    <!-- Vẫn giữ FontAwesome chỉ để dùng cho mạng xã hội -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top right, #2a2a35, #121214);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            transition: cursor 0.3s;
        }

        /* BẢNG ĐIỀU KHIỂN (Làm lại dạng nút nhỏ gọn, bỏ dropdown) */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* KHUNG THẺ CHÍNH */
        .cv-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 45px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255,255,255,0.05);
            z-index: 10;
            /* Hiệu ứng mọc lên mượt mà */
            animation: fadeInUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
            transition: box-shadow 0.5s ease;
        }

        .cv-card:hover {
            box-shadow: 0 20px 60px rgba(255, 255, 255, 0.05), inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 18px;
            padding: 4px; /* Tạo viền đôi mỏng */
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .title {
            color: #8b8b93;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* SECTIONS (Tối giản hóa, bỏ icon thừa) */
        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #8b8b93;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #about-text {
            font-size: 14px;
            line-height: 1.8;
            color: #d4d4d8;
            min-height: 80px; /* Chống giật khung khi gõ chữ */
        }
        
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s step-end infinite;
            color: #fff;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* SKILL TAGS */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.05);
            color: #d4d4d8;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
            cursor: default;
        }

        .skill-tag:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-2px);
        }

        .yapping-skill {
            background: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
            cursor: pointer;
        }
        .yapping-skill:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff8e8e;
        }

        /* DONATE BUTTON */
        .donate-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .donate-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* SOCIAL LINKS */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-links a {
            color: #8b8b93;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* DONATE MODAL (Popup) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: #1c1c24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: #8b8b93;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-modal:hover { color: #fff; }

        .modal-content h3 { margin-bottom: 10px; font-size: 18px; }
        .modal-content p { font-size: 13px; color: #8b8b93; margin-bottom: 20px; }
        
        .modal-content input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-content input:focus {
            border-color: rgba(255,255,255,0.3);
        }

        .qr-box {
            width: 100%;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* JUMPSCARE & SNOW */
        #jumpscare-container {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: black; z-index: 99999;
        }
        #jumpscare-container img { width: 100%; height: 100%; object-fit: contain; }

        .snowflake {
            position: fixed; top: -10px; color: #fff; font-size: 1em;
            user-select: none; z-index: 1; pointer-events: none;
            animation-name: fall, shake; animation-iteration-count: infinite, infinite;
            animation-timing-function: linear, ease-in-out; opacity: 0.8;
        }
        @keyframes fall { 100% { top: 100vh; } }
        @keyframes shake { 50% { transform: translateX(20px); } }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .cv-card { padding: 35px 25px; border-radius: 24px; }
            .controls { top: auto; bottom: 20px; right: 50%; transform: translateX(50%); width: max-content; }
        }
    </style>
</head>
<body>

    <!-- Jumpscare -->
    <div id="jumpscare-container">
        <img src="https://orion-uploads.openroadmedia.com/md_ebb42c5c23d5-jump-scare-feat.jpg" alt="Jumpscare">
    </div>

    <!-- Nút điều khiển dạng Dock nổi (Đẹp và thẩm mỹ hơn Select Dropdown) -->
    <div class="controls">
        <button id="snow-toggle" class="ctrl-btn" onclick="toggleSnow()">❄️ Tuyết</button>
        <button class="ctrl-btn" onclick="changeCursor('default')" title="Mặc định">🖱️</button>
        <button class="ctrl-btn" onclick="changeCursor('crosshair')" title="Ngắm bắn">🎯</button>
    </div>

    <!-- Modal Donate -->
    <div class="modal-overlay" id="donateModal">
        <div class="modal-content" id="modalContent">
            <i class="fas fa-times close-modal" onclick="closeDonate()"></i>
            <h3>Ủng hộ Vinhx</h3>
            <p>Nhập số tiền bạn muốn donate để tạo mã QR</p>
            <input type="number" id="donateAmount" placeholder="Nhập số tiền (VNĐ)..." oninput="updateQR()">
            <div class="qr-box">
                <!-- ĐỔI CHỮ 'MB' THÀNH MÃ NGÂN HÀNG CỦA BẠN (VD: VCB, ACB, TPB) NẾU BẠN KHÔNG DÙNG MBBANK -->
                <img id="qrImage" src="https://img.vietqr.io/image/MB-33689707-compact2.png?amount=0&accountName=NGUYEN%20NGOC%20TRI%20VINH&addInfo=Donate%20Vinhx" alt="QR Code">
            </div>
        </div>
    </div>

    <div class="cv-card">
        <div class="header">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3lwaHF6MTI1NmpyajNpcHNsY3hzZHFsMWhzZWhpc3ljNGRha21ubiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/s2pr9CVOvU4NMBsnYf/giphy.gif" alt="Avatar" class="avatar">
            <h1 class="name">Vinhx</h1>
            <p class="title">Software Developer</p>
        </div>

        <div class="section">
            <h2>About</h2>
            <p id="about-text" class="typing-cursor"></p>
        </div>

        <div class="section">
            <h2>Skills</h2>
            <div class="skills-container">
                <span class="skill-tag">HTML / CSS</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Java</span>
                <span class="skill-tag">Lua</span>
                <span class="skill-tag yapping-skill" onclick="triggerJumpscare()">Yapping 👀</span>
            </div>
        </div>

        <!-- Nút Donate gọn gàng, tinh tế -->
        <button class="donate-btn" onclick="openDonate()">
            ☕ Buy me a coffee
        </button>

        <div class="social-links">
            <a href="https://vinhx.site/" target="_blank"><i class="fas fa-globe"></i></a>
            <a href="https://github.com/vinhxdev" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.facebook.com/nguyenvinhtriowo/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://steamcommunity.com/id/P1mple1st/" target="_blank"><i class="fab fa-steam"></i></a>
        </div>
    </div>

    <script>
        // 1. TYPING EFFECT
        const textToType = "Hello! I am a software developer with a strong passion for automation and system optimization. Always ready to solve real-world logic problems.";
        let typingIndex = 0;
        let isDeleting = false;
        
        function typeWriterEffect() {
            const el = document.getElementById("about-text");
            if (!isDeleting && typingIndex <= textToType.length) {
                el.innerHTML = textToType.substring(0, typingIndex);
                typingIndex++;
                setTimeout(typeWriterEffect, 35);
            } else if (!isDeleting && typingIndex > textToType.length) {
                isDeleting = true;
                setTimeout(typeWriterEffect, 4000);
            } else if (isDeleting && typingIndex >= 0) {
                el.innerHTML = textToType.substring(0, typingIndex);
                typingIndex--;
                setTimeout(typeWriterEffect, 15);
            } else if (isDeleting && typingIndex < 0) {
                isDeleting = false;
                setTimeout(typeWriterEffect, 500);
            }
        }
        typeWriterEffect();

        // 2. DONATE MODAL & QR LOGIC
        const modal = document.getElementById('donateModal');
        const modalContent = document.getElementById('modalContent');
        
        function openDonate() {
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 10);
        }

        function closeDonate() {
            modal.style.opacity = '0';
            modalContent.style.transform = 'scale(0.9)';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function updateQR() {
            const amount = document.getElementById('donateAmount').value;
            const img = document.getElementById('qrImage');
            // THAY ĐỔI 'MB' Ở LINK DƯỚI NẾU BẠN DÙNG NGÂN HÀNG KHÁC
            img.src = `https://img.vietqr.io/image/MB-33689707-compact2.png?amount=${amount}&accountName=NGUYEN%20NGOC%20TRI%20VINH&addInfo=Donate%20Vinhx`;
        }

        // Đóng modal khi bấm ra ngoài viền đen
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeDonate();
        });

        // 3. CÁC TÍNH NĂNG KHÁC (Jumpscare, Tuyết, Cursor, Chống Copy)
        function triggerJumpscare() {
            const js = document.getElementById('jumpscare-container');
            js.style.display = 'block';
            setTimeout(() => { js.style.display = 'none'; }, 1500);
        }

        function changeCursor(type) {
            document.body.style.cursor = type;
            document.querySelectorAll('a, button, input, .skill-tag').forEach(el => {
                if(!el.classList.contains('yapping-skill')) {
                    el.style.cursor = type === 'default' ? 'pointer' : type;
                }
            });
        }

        let snowEnabled = false; let snowInterval;
        function createSnowflake() {
            if (!snowEnabled) return;
            const sf = document.createElement('div');
            sf.classList.add('snowflake'); sf.innerHTML = '❄';
            sf.style.left = Math.random() * 100 + 'vw';
            sf.style.animationDuration = Math.random() * 3 + 2 + 's';
            sf.style.fontSize = Math.random() * 8 + 10 + 'px';
            document.body.appendChild(sf);
            setTimeout(() => sf.remove(), 4000);
        }
        function toggleSnow() {
            snowEnabled = !snowEnabled;
            const btn = document.getElementById('snow-toggle');
            if (snowEnabled) {
                btn.style.background = 'rgba(255, 255, 255, 0.2)';
                snowInterval = setInterval(createSnowflake, 200);
            } else {
                btn.style.background = 'rgba(255, 255, 255, 0.05)';
                clearInterval(snowInterval);
                document.querySelectorAll('.snowflake').forEach(e => e.remove());
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'S'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0)))) return false;
        }
    </script>
</body>
</html>
