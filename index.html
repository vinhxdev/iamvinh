<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinhx - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            /* Nền đen nhám chuyên nghiệp chuẩn Dev */
            background-color: #09090b;
            /* Họa tiết lưới mờ (Grid) */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ededed;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* BẢNG ĐIỀU KHIỂN */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .ctrl-btn {
            background: #18181b;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn:hover {
            background: #27272a;
            color: #fff;
            border-color: #3f3f46;
        }

        /* KHUNG THẺ CHÍNH - Phẳng, tối và sắc nét */
        .cv-card {
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 16px; /* Bo góc nhẹ hơn, nam tính hơn */
            padding: 45px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            z-index: 10;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(20px);
            opacity: 0;
        }

        @keyframes fadeInUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #27272a;
            margin-bottom: 18px;
            padding: 4px; 
            pointer-events: none; 
            background: #09090b;
        }

        .name {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .title {
            color: #71717a;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        /* SECTIONS */
        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 8px;
        }

        #about-text {
            font-size: 14px;
            line-height: 1.7;
            color: #a1a1aa;
            min-height: 80px; 
        }
        
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-end infinite;
            color: #ffffff;
            margin-left: 4px;
            font-size: 12px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* SKILL TAGS - Kiểu Code Terminal */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: #18181b;
            color: #a1a1aa;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid #27272a;
            transition: all 0.2s ease;
            cursor: default;
        }

        .skill-tag:hover {
            background: #27272a;
            color: #fff;
            border-color: #3f3f46;
        }

        .yapping-skill {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.2);
            cursor: pointer;
        }
        .yapping-skill:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        /* DONATE BUTTON - Nổi bật, gọn gàng */
        .donate-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .donate-btn:hover {
            background: #e4e4e7;
            transform: translateY(-1px);
        }

        /* SOCIAL LINKS */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-links a {
            color: #71717a;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #18181b;
            border: 1px solid #27272a;
        }

        .social-links a:hover {
            color: #ffffff;
            background: #27272a;
            border-color: #3f3f46;
        }

        /* DONATE MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000;
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease;
        }
        .modal-content {
            background: #121214; border: 1px solid #27272a; border-radius: 16px;
            padding: 25px; width: 90%; max-width: 320px; text-align: center; position: relative;
            transform: scale(0.95); transition: transform 0.2s ease;
        }
        .close-modal {
            position: absolute; top: 12px; right: 15px; color: #71717a; font-size: 18px;
            cursor: pointer; transition: color 0.2s;
        }
        .close-modal:hover { color: #fff; }
        .modal-content h3 { margin-bottom: 8px; font-size: 16px; color: #fff; }
        .modal-content p { font-size: 12px; color: #a1a1aa; margin-bottom: 18px; }
        .modal-content input {
            width: 100%; background: #09090b; border: 1px solid #27272a;
            color: #fff; padding: 10px 15px; border-radius: 8px; font-size: 15px; outline: none;
            margin-bottom: 18px; text-align: center; font-family: 'JetBrains Mono', monospace;
        }
        .modal-content input:focus { border-color: #52525b; }
        .qr-box {
            width: 100%; aspect-ratio: 1; background: #fff; border-radius: 8px; padding: 10px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            pointer-events: none;
        }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }

        /* JUMPSCARE & SNOW */
        #jumpscare-container {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: black; z-index: 99999;
        }
        #jumpscare-container img { width: 100%; height: 100%; object-fit: contain; }
        .snowflake {
            position: fixed; top: -10px; color: #fff; font-size: 1em;
            user-select: none; z-index: 1; pointer-events: none;
            animation-name: fall, shake; animation-iteration-count: infinite, infinite;
            animation-timing-function: linear, ease-in-out; opacity: 0.5;
        }
        @keyframes fall { 100% { top: 100vh; } }
        @keyframes shake { 50% { transform: translateX(15px); } }

        @media (max-width: 600px) {
            .cv-card { padding: 35px 25px; border-radius: 12px; border-left: none; border-right: none; }
            .controls { top: auto; bottom: 20px; right: 50%; transform: translateX(50%); width: max-content; }
        }
    </style>
</head>
<body>

    <div id="jumpscare-container">
        <img src="https://orion-uploads.openroadmedia.com/md_ebb42c5c23d5-jump-scare-feat.jpg" alt="Jumpscare">
    </div>

    <div class="controls">
        <button id="snow-toggle" class="ctrl-btn" onclick="toggleSnow()">❄️ Snow</button>
        <button class="ctrl-btn" onclick="changeCursor('default')" title="Default">🖱️</button>
        <button class="ctrl-btn" onclick="changeCursor('crosshair')" title="Crosshair">🎯</button>
    </div>

    <div class="modal-overlay" id="donateModal">
        <div class="modal-content" id="modalContent">
            <i class="fas fa-times close-modal" onclick="closeDonate()"></i>
            <h3>Fund my coffee</h3>
            <p>Nhập số tiền (VNĐ) để tạo QR</p>
            <input type="number" id="donateAmount" placeholder="0" oninput="updateQR()">
            <div class="qr-box">
                <!-- Đã đổi sang ngân hàng ACB -->
                <img id="qrImage" src="https://img.vietqr.io/image/ACB-33689707-compact2.png?amount=0&accountName=NGUYEN%20NGOC%20TRI%20VINH&addInfo=Donate%20Vinhx" alt="QR Code">
            </div>
        </div>
    </div>

    <div class="cv-card">
        <div class="header">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3lwaHF6MTI1NmpyajNpcHNsY3hzZHFsMWhzZWhpc3ljNGRha21ubiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/s2pr9CVOvU4NMBsnYf/giphy.gif" alt="Avatar" class="avatar">
            <h1 class="name">Vinhx</h1>
            <p class="title">Software Developer</p>
        </div>

        <div class="section">
            <h2>About_Me</h2>
            <p id="about-text" class="typing-cursor"></p>
        </div>

        <div class="section">
            <h2>Tech_Stack</h2>
            <div class="skills-container">
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Java</span>
                <span class="skill-tag">Lua</span>
                <span class="skill-tag yapping-skill" onclick="triggerJumpscare()">Yapping()</span>
            </div>
        </div>

        <button class="donate-btn" onclick="openDonate()">
            <i class="fa-solid fa-mug-hot"></i> Buy me a coffee
        </button>

        <div class="social-links">
            <a href="https://vinhx.site/" target="_blank"><i class="fas fa-globe"></i></a>
            <a href="https://github.com/vinhxdev" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.facebook.com/nguyenvinhtriowo/" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://steamcommunity.com/id/P1mple1st/" target="_blank"><i class="fab fa-steam"></i></a>
        </div>
    </div>

    <script>
        // BẢO MẬT & ANTI-TAMPER
        console.log("%c[SECURE AREA]", "color: #ef4444; font-size: 20px; font-weight: bold;");
        console.log("%cStatic Frontend Only. Access Denied for Debugging.", "color: #a1a1aa; font-size: 12px;");

        document.ondragstart = function() { return false; };
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) return false;
            if(e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) return false;
        };
        setInterval(function() {
            const before = new Date().getTime();
            debugger;
            const after = new Date().getTime();
            if (after - before > 100) {
                document.body.innerHTML = "<div style='color:#ef4444; font-size:20px; text-align:center; margin-top:20vh; font-family:monospace;'>[ERR] Debugger detected.</div>";
            }
        }, 1000);
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length > 0) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.tagName === 'SCRIPT' || node.tagName === 'IFRAME') node.remove();
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // GÕ CHỮ
        const textToType = "Hello! I am a software developer with a strong passion for automation and system optimization. Always ready to solve real-world logic problems.";
        let typingIndex = 0;
        let isDeleting = false;
        
        function typeWriterEffect() {
            const el = document.getElementById("about-text");
            if (!isDeleting && typingIndex <= textToType.length) {
                el.innerHTML = textToType.substring(0, typingIndex);
                typingIndex++;
                setTimeout(typeWriterEffect, 25);
            } else if (!isDeleting && typingIndex > textToType.length) {
                isDeleting = true;
                setTimeout(typeWriterEffect, 5000);
            } else if (isDeleting && typingIndex >= 0) {
                el.innerHTML = textToType.substring(0, typingIndex);
                typingIndex--;
                setTimeout(typeWriterEffect, 10);
            } else if (isDeleting && typingIndex < 0) {
                isDeleting = false;
                setTimeout(typeWriterEffect, 800);
            }
        }
        typeWriterEffect();

        // DONATE MODAL (Đã đổi sang ACB)
        const modal = document.getElementById('donateModal');
        const modalContent = document.getElementById('modalContent');
        
        function openDonate() {
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 10);
        }

        function closeDonate() {
            modal.style.opacity = '0';
            modalContent.style.transform = 'scale(0.95)';
            setTimeout(() => { modal.style.display = 'none'; }, 200);
        }

        function updateQR() {
            let amount = document.getElementById('donateAmount').value.replace(/[^0-9]/g, '');
            const img = document.getElementById('qrImage');
            // Cập nhật ngân hàng ACB
            img.src = `https://img.vietqr.io/image/ACB-33689707-compact2.png?amount=${amount}&accountName=NGUYEN%20NGOC%20TRI%20VINH&addInfo=Donate%20Vinhx`;
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeDonate();
        });

        // CHỨC NĂNG KHÁC
        function triggerJumpscare() {
            const js = document.getElementById('jumpscare-container');
            js.style.display = 'block';
            setTimeout(() => { js.style.display = 'none'; }, 1500);
        }

        function changeCursor(type) {
            document.body.style.cursor = type;
            document.querySelectorAll('a, button, input, .skill-tag').forEach(el => {
                if(!el.classList.contains('yapping-skill')) {
                    el.style.cursor = type === 'default' ? 'pointer' : type;
                }
            });
        }

        let snowEnabled = false; let snowInterval;
        function createSnowflake() {
            if (!snowEnabled) return;
            const sf = document.createElement('div');
            sf.classList.add('snowflake'); sf.innerHTML = '❄';
            sf.style.left = Math.random() * 100 + 'vw';
            sf.style.animationDuration = Math.random() * 2 + 2 + 's';
            sf.style.fontSize = Math.random() * 6 + 8 + 'px';
            document.body.appendChild(sf);
            setTimeout(() => sf.remove(), 4000);
        }
        function toggleSnow() {
            snowEnabled = !snowEnabled;
            const btn = document.getElementById('snow-toggle');
            if (snowEnabled) {
                btn.style.background = '#27272a';
                btn.style.color = '#fff';
                snowInterval = setInterval(createSnowflake, 150);
            } else {
                btn.style.background = '#18181b';
                btn.style.color = '#a1a1aa';
                clearInterval(snowInterval);
                document.querySelectorAll('.snowflake').forEach(e => e.remove());
            }
        }
    </script>
</body>
</html>
